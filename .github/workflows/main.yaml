name: Terraform

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/preprod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        run: |
          az login \
            --service-principal \
            --username "4c39cdd6-47b7-4694-9224-60bdfb50bd82" \
            --password "qPp8Q~qy6Vm8Pw61iAPQWJ-u-ArqVVtUYU3Mhci~" \
            --tenant "08a484da-f43b-41e9-8da5-48cb5e3d6569"

      - name: Set Azure Subscription
        run: |
          az account set \
            --subscription "76b0593c-0cb3-4992-8bd2-1dfbc58ec5af"

      - name: Check Azure Login
        run: az account show

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    needs: terraform-plan

    # Apply ONLY after push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: environments/preprod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        run: |
          az login \
            --service-principal \
            --username "4c39cdd6-47b7-4694-9224-60bdfb50bd82" \
            --password "qPp8Q~qy6Vm8Pw61iAPQWJ-u-ArqVVtUYU3Mhci~" \
            --tenant "08a484da-f43b-41e9-8da5-48cb5e3d6569"
      - name: Set Azure Subscription
        run: |
          az account set \
            --subscription "76b0593c-0cb3-4992-8bd2-1dfbc58ec5af"

      - name: Check Azure Login
        run: az account show

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
